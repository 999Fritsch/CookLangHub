{# The head of every Cookbook page: the name, who owns it, and the way out
   to Forgejo. The same shape as a Recipe, in `recipe_sharing.html`. #}
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-2">
  <h1 class="text-3xl font-bold bg-gradient-to-r from-orange-600 to-yellow-600 bg-clip-text text-transparent">{{ title }}</h1>
  <a class="btn-primary px-5 py-2 rounded-full font-medium text-white whitespace-nowrap self-start"
     href="{{ forgejo_url }}">Open in Forgejo</a>
</div>
<p class="text-gray-600 mb-4">Owned by {{ owner }}</p>
