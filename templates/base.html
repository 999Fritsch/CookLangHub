<!DOCTYPE html>
<html lang="en"{% if !layout.theme.attribute().is_empty() %} data-theme="{{ layout.theme.attribute() }}"{% endif %}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CookLangHub{% endblock %}</title>
    <link rel="stylesheet" href="/static/tokens.css">
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the main content</a>
    <header class="site-header">
      <a class="brand" href="/">CookLangHub</a>
      <nav class="site-nav" aria-label="Account">
        {% if layout.signed_in %}
        <span class="account">
          {% if !layout.user_avatar.is_empty() %}
          <img class="avatar" src="{{ layout.user_avatar }}" alt="" width="24" height="24">
          {% endif %}
          <span class="account-name">{{ layout.user_name }}</span>
        </span>
        <form class="signout-form" method="post" action="/auth/sign-out">
          <button class="button" type="submit">Sign out</button>
        </form>
        {% else %}
        <a class="button button--primary" href="/auth/sign-in">Sign in</a>
        {% endif %}
      </nav>
    </header>
    <main id="main" class="{% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <form class="theme-choice" method="post" action="/preferences/theme">
        <input type="hidden" name="return_to" value="{{ layout.path }}">
        <fieldset>
          <legend>Appearance</legend>
          <button type="submit" name="theme" value="system"
                  {% if layout.theme.is("system") %}aria-pressed="true" class="is-chosen"{% else %}aria-pressed="false"{% endif %}>System</button>
          <button type="submit" name="theme" value="light"
                  {% if layout.theme.is("light") %}aria-pressed="true" class="is-chosen"{% else %}aria-pressed="false"{% endif %}>Light</button>
          <button type="submit" name="theme" value="dark"
                  {% if layout.theme.is("dark") %}aria-pressed="true" class="is-chosen"{% else %}aria-pressed="false"{% endif %}>Dark</button>
        </fieldset>
      </form>
      <p>CookLangHub {{ layout.version }} &middot; AGPL-3.0-or-later</p>
    </footer>
  </body>
</html>
