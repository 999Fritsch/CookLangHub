[package]
name = "cooklanghub"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A collaborative Cooklang Recipe platform backed by Forgejo"
repository = "https://github.com/999Fritsch/CookLangHub"

[dependencies]
anyhow = "1"
askama = "0.16"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
hkdf = "0.12"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "form", "cookies"] }
serde_json = "1"
tempfile = "3"
testcontainers = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
